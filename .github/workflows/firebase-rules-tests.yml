name: Firebase RTDB rules tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [live-map-development]

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx firebase emulators:exec --only database --project demo-taxi-capital-rules "npm test"
